{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Project</title>
    <link rel="stylesheet" href="{% static "style.css" %}">
</head>
<body>
   <center> <h1>This is Conext</h1></center>
   <h1>Student Data</h1>
   <hr>
   {% if data%}
   {% for i in data %}
    <h1>Name: {{i.name}}</h1>
    <h1>Subject: {{i.subject}}</h1>
    <h1>Marks: {{i.marks}}</h1>
    <hr>
    {% endfor %}
    {%else%}
    <h1>Data is not present</h1>
    {% endif %}
</body>
</html>
